apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      nodeSelector:
        workload: app

      containers:
        - name: backend

          image: omkar1907/mern-backend:v16

          imagePullPolicy: Always

          ports:
            - containerPort: 3500

          env:
            - name: PORT
              value: "3500"

            - name: MONGO_CONN_STR
              value: mongodb://root:rootpassword@mongodb:27017/tasks?authSource=admin

            - name: USE_DB_AUTH
              value: "true"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /ok
              port: 3500
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ok
              port: 3500
            initialDelaySeconds: 5
            periodSeconds: 5